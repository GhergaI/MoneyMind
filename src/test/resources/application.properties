# Test-wide overrides.
#
# Spring Boot loads application.properties in addition to application.yml and
# gives .properties the higher precedence, so this overrides individual keys
# without having to restate the whole of src/main/resources/application.yml.
#
# The demo seeder must never run in tests: it fills the ledger before a test's
# own fixtures are written, and its savings_goal rows hold foreign keys into
# account that make a test's `DELETE FROM account` fail.
moneymind.demo-data.enabled=false
